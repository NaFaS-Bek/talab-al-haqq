name: Check published site
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-site-audit.yml'
      - 'tests/live-site-audit.cjs'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Exact public HTTPS URL of Talab al-Haqq, ending with /'
        required: true
        type: string
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public pages, live content and headers against main
        # A live-deployment issue is useful evidence but should not hide a
        # valid workflow fix while it is being reviewed.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: node tests/live-site-audit.cjs
        env:
          TALAB_SITE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.site_url || 'https://talab-al-haqq.rnafasbek.workers.dev/' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-audit-report
          path: live-site-report.json
          if-no-files-found: warn
