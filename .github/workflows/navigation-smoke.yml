name: Navigation smoke checks
on:
  push:
    branches: [main, feature/organized-navigation]
  pull_request:
    branches: [main]
jobs:
  navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/live-site-audit.cjs
      - run: node tests/site-wide-integrity.cjs
      - run: node tests/navigation-smoke.cjs
      - run: node tests/content-audit.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/talab-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.cjs
          node tests/site-wide-browser-smoke.cjs
          node tests/site-performance-baseline.cjs
          node tests/arabic-lesson-smoke.cjs
          node tests/five-pillars-smoke.cjs
          node tests/wudu-salah-smoke.cjs
          node tests/family-rights-smoke.cjs
          node tests/family-curriculum-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-screenshots
          path: |
            navigation-*.png
            performance-local-baseline.json
            arabic-lesson-*.png
            five-pillars-*.png
            pillar-*.png
            wudu-guide-*.png
            salah-guide-*.png
            family-rights-*.png
            family-family-*.png
          if-no-files-found: ignore
