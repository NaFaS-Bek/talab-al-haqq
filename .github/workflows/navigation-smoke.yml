name: Navigation smoke checks
on:
  push:
    branches: [feature/organized-navigation]
  pull_request:
    branches: [main]
jobs:
  navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/navigation-smoke.cjs
