name: Navigation smoke checks
on:
  push:
    branches: [feature/organized-navigation]
  pull_request:
    branches: [main]
jobs:
  navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/navigation-smoke.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/talab-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-screenshots
          path: navigation-*.png
          if-no-files-found: ignore
