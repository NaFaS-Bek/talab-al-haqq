name: Navigation smoke checks
on:
  push:
    branches: [main, feature/organized-navigation]
  pull_request:
    branches: [main]
jobs:
  navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/live-site-audit.cjs
      - name: Print complete SHA-256 manifest for release verification
        run: python3 tool/prepare_website.py --print-manifest
      - name: Ensure committed SW hashes match every educational resource
        run: python3 tool/prepare_website.py --check-root
      - name: Prepare reproducible verified offline bundle
        run: python3 tool/prepare_website.py --build build/website
      - run: node tests/site-wide-integrity.cjs
      - run: node tests/navigation-smoke.cjs
      - run: node tests/content-audit.cjs
      - run: node tests/quran-stories-source-regressions.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/talab-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.cjs
          node tests/site-wide-browser-smoke.cjs
          node tests/quran-stories-browser-smoke.cjs
          node tests/site-performance-baseline.cjs
          node tests/arabic-lesson-smoke.cjs
          node tests/five-pillars-smoke.cjs
          node tests/wudu-salah-smoke.cjs
          node tests/family-rights-smoke.cjs
          node tests/family-curriculum-smoke.cjs
      - name: Real offline install, update, data and integrity regression
        run: |
          cp -a build/website build/tampered
          printf '\n/* intentionally damaged for SHA-256 rejection test */\n' >> build/tampered/style.css
          python3 -m http.server 8766 --bind 127.0.0.1 --directory build/website >/tmp/talab-offline.log 2>&1 &
          python3 -m http.server 8767 --bind 127.0.0.1 --directory build/tampered >/tmp/talab-tampered.log 2>&1 &
          sleep 2
          node tests/offline-pwa-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-offline-release
          path: build/website/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-screenshots
          path: |
            navigation-*.png
            performance-local-baseline.json
            arabic-lesson-*.png
            five-pillars-*.png
            pillar-*.png
            wudu-guide-*.png
            salah-guide-*.png
            family-rights-*.png
            family-family-*.png
          if-no-files-found: ignore
