name: Adhkar content audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'family-children.html'
      - 'family-rights.html'
      - 'family-difficult-passages.html'
      - 'tests/family-difficult-passages-source-regressions.cjs'
      - 'docs/family-difficult-passages-source-review-pass11-2026-11-22.md'
      - 'family-nikah.html'
      - 'family-mahr.html'
      - 'family-prophetic-example.html'
      - 'tests/family-primary-source-context-pass10.cjs'
      - 'docs/family-primary-source-review-pass10-2026-11-22.md'
      - 'family-child-rights.html'
      - 'family-parent-duties.html'
      - 'family-custody.html'
      - 'family-child-safety.html'
      - 'family-teen-dialogue.html'
      - 'family-filial-duties.html'
      - 'tests/family-filial-duties-source-regressions.cjs'
      - 'docs/family-filial-duties-source-review-pass8-2026-11-22.md'
      - 'tests/family-teen-dialogue-source-regressions.cjs'
      - 'tests/family-cross-lesson-consistency.cjs'
      - 'docs/family-cross-lesson-consistency-pass9-2026-11-22.md'
      - 'docs/family-teen-dialogue-source-review-pass7-2026-11-22.md'
      - 'tests/family-child-safety-source-regressions.cjs'
      - 'docs/family-child-safety-source-review-pass6-2026-11-22.md'
      - 'tests/family-custody-source-regressions.cjs'
      - 'docs/family-custody-source-review-pass5-2026-11-22.md'
      - 'tests/family-parent-duties-source-regressions.cjs'
      - 'docs/family-parent-duties-source-review-pass4-2026-11-22.md'
      - 'tests/family-child-rights-source-regressions.cjs'
      - 'docs/family-child-rights-source-review-2026-11-22.md'
      - 'tests/family-children-source-regressions.cjs'
      - 'tests/family-curriculum-smoke.cjs'
      - 'docs/family-children-source-review-pass1-2026-11-22.md'
      - 'docs/family-children-age-guidance-pass2-2026-11-22.md'
      - 'docs/family-curriculum-source-review-2026-11-22.md'
      - 'tests/browser-smoke.cjs'
      - 'docs/adhkar-quran-verb-forms-reading-pass2-2026-11-22.md'
      - 'docs/adhkar-quran-consonants-reading-pass3-2026-11-22.md'
      - 'docs/adhkar-quran-length-shadda-pause-pass4-2026-11-22.md'
      - 'data/content.json'
      - 'tests/content-audit.cjs'
      - 'tests/adhkar-source-regressions.cjs'
      - 'tests/adhkar-hadith-deep-batch.cjs'
      - 'tests/adhkar-quran-deep-batch.cjs'
      - 'tests/adhkar-quran-unicode-batch1.cjs'
      - 'tests/adhkar-quran-unicode-remaining-duas.cjs'
      - 'tests/adhkar-quran-pause-source-comparison.cjs'
      - 'tests/verify-official-tanzil.py'
      - 'docs/quran-source-export-and-rendering-policy-2026-11-22.md'
      - 'docs/adhkar-quran-pause-source-comparison-pass5-2026-11-22.md'
      - 'tests/adhkar-tanzil-exact-54.cjs'
      - 'tests/adhkar-quran-transliteration-review-anchors.cjs'
      - 'docs/adhkar-quran-transliteration-review-pass1-2026-11-22.md'
      - 'tests/fixtures/tanzil-uthmani-1.1-quran-sample-54.json'
      - 'tests/fixtures/tanzil-uthmani-1.1-four-duas.txt'
      - 'tests/fixtures/tanzil-uthmani-1.1-remaining-duas.txt'
      - 'tests/adhkar-prophets-deep-batch.cjs'
      - 'tests/adhkar-prophets-deep-batch-6.cjs'
      - 'tests/adhkar-short-surahs-batch-7.cjs'
      - 'tests/adhkar-hadith-final-13.cjs'
      - 'tests/adhkar-phonetics-batch2.cjs'
      - 'docs/adhkar-deep-review-batch-8-2026-11-22.md'
      - 'docs/adhkar-quran-unicode-pass1-2026-11-22.md'
      - 'docs/adhkar-quran-unicode-pass2-2026-11-22.md'
      - 'docs/adhkar-tanzil-exact-54-2026-11-22.md'
      - 'docs/adhkar-phonetics-pass2-four-hadith-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-7-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-6-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-5-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-4-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-3-2026-11-22.md'
      - 'tests/transliteration-inventory.cjs'
      - '.github/workflows/adhkar-content-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural content audit
        run: node tests/content-audit.cjs
      - name: Child upbringing source and attribution guards
        run: node tests/family-children-source-regressions.cjs
      - name: Child rights source and interpretation safeguards
        run: node tests/family-child-rights-source-regressions.cjs
      - name: Parental duties source and multi-school fiqh safeguards
        run: node tests/family-parent-duties-source-regressions.cjs
      - name: Sensitive family passages tafsir hadith and safety attribution
        run: node tests/family-difficult-passages-source-regressions.cjs
      - name: Deep family primary source context safeguards (pass 10)
        run: node tests/family-primary-source-context-pass10.cjs
      - name: Cross-lesson family curriculum consistency and review status
        run: node tests/family-cross-lesson-consistency.cjs
      - name: Parent respect Quran, hadith and comparative fiqh source guards
        run: node tests/family-filial-duties-source-regressions.cjs
      - name: Teen dialogue sources, boundaries and safety checks
        run: node tests/family-teen-dialogue-source-regressions.cjs
      - name: Child safeguarding lesson sources and safety limitations
        run: node tests/family-child-safety-source-regressions.cjs
      - name: Custody after divorce source and child-safety safeguards
        run: node tests/family-custody-source-regressions.cjs
      - name: Source regression checks
        run: node tests/adhkar-source-regressions.cjs
      - name: Eight hadith source-linked wording regression checks
        run: node tests/adhkar-hadith-deep-batch.cjs
      - name: Four Quranic supplication and narrative-boundary checks
        run: node tests/adhkar-quran-deep-batch.cjs
      - name: Four Quranic verses exact Unicode comparison with Tanzil snapshot
        run: node tests/adhkar-quran-unicode-batch1.cjs
      - name: Remaining 11 Quranic duas Unicode and stop-sign profile comparison
        run: node tests/adhkar-quran-unicode-remaining-duas.cjs
      - name: Validate official source audit script syntax
        run: python3 -m py_compile tests/verify-official-tanzil.py
      - name: Try official Tanzil source fetch and SHA-256 comparison
        id: official_tanzil
        continue-on-error: true
        run: python3 tests/verify-official-tanzil.py
      - name: Upload official source provenance result (NOT a certificate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-tanzil-provenance-attempt
          path: official-tanzil-provenance-attempt.json
          if-no-files-found: warn
      - name: Quran waqf mark positions against pinned Tanzil mirror
        run: node tests/adhkar-quran-pause-source-comparison.cjs
      - name: Independent Tanzil exact Unicode comparison for 54 Quran verses
        run: node tests/adhkar-tanzil-exact-54.cjs
      - name: Quranic dua phonetic review anchors (not expert certification)
        run: node tests/adhkar-quran-transliteration-review-anchors.cjs
      - name: Five prophet supplications and narrative boundaries
        run: node tests/adhkar-prophets-deep-batch.cjs
      - name: Six additional prophet supplications and context boundaries
        run: node tests/adhkar-prophets-deep-batch-6.cjs
      - name: Seven short surahs and Dawud 5082 timing and recitation checks
        run: node tests/adhkar-short-surahs-batch-7.cjs
      - name: Final 13 hadith cards source and wording regression checks
        run: node tests/adhkar-hadith-final-13.cjs
      - name: Four hadith phonetics end-form and source guards
        run: node tests/adhkar-phonetics-batch2.cjs
      - name: Export transliteration review inventory
        run: node tests/transliteration-inventory.cjs > transliteration-inventory.json
      - name: Validate inventory report
        run: |
          node -e "const r=require('./transliteration-inventory.json');if(r.totalEntries!==43)throw Error('Expected 43 cards, found '+r.totalEntries); console.log('Inventory contains',r.totalEntries,'cards;',r.totalFlagged,'flagged for human review')"
      - name: Upload review inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transliteration-inventory
          path: transliteration-inventory.json
          if-no-files-found: warn
