name: Adhkar content audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'tests/browser-smoke.cjs'
      - 'docs/adhkar-quran-verb-forms-reading-pass2-2026-11-22.md'
      - 'docs/adhkar-quran-consonants-reading-pass3-2026-11-22.md'
      - 'docs/adhkar-quran-length-shadda-pause-pass4-2026-11-22.md'
      - 'data/content.json'
      - 'tests/content-audit.cjs'
      - 'tests/adhkar-source-regressions.cjs'
      - 'tests/adhkar-hadith-deep-batch.cjs'
      - 'tests/adhkar-quran-deep-batch.cjs'
      - 'tests/adhkar-quran-unicode-batch1.cjs'
      - 'tests/adhkar-quran-unicode-remaining-duas.cjs'
      - 'tests/adhkar-tanzil-exact-54.cjs'
      - 'tests/adhkar-quran-transliteration-review-anchors.cjs'
      - 'docs/adhkar-quran-transliteration-review-pass1-2026-11-22.md'
      - 'tests/fixtures/tanzil-uthmani-1.1-quran-sample-54.json'
      - 'tests/fixtures/tanzil-uthmani-1.1-four-duas.txt'
      - 'tests/fixtures/tanzil-uthmani-1.1-remaining-duas.txt'
      - 'tests/adhkar-prophets-deep-batch.cjs'
      - 'tests/adhkar-prophets-deep-batch-6.cjs'
      - 'tests/adhkar-short-surahs-batch-7.cjs'
      - 'tests/adhkar-hadith-final-13.cjs'
      - 'tests/adhkar-phonetics-batch2.cjs'
      - 'docs/adhkar-deep-review-batch-8-2026-11-22.md'
      - 'docs/adhkar-quran-unicode-pass1-2026-11-22.md'
      - 'docs/adhkar-quran-unicode-pass2-2026-11-22.md'
      - 'docs/adhkar-tanzil-exact-54-2026-11-22.md'
      - 'docs/adhkar-phonetics-pass2-four-hadith-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-7-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-6-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-5-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-4-2026-11-22.md'
      - 'docs/adhkar-deep-review-batch-3-2026-11-22.md'
      - 'tests/transliteration-inventory.cjs'
      - '.github/workflows/adhkar-content-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural content audit
        run: node tests/content-audit.cjs
      - name: Source regression checks
        run: node tests/adhkar-source-regressions.cjs
      - name: Eight hadith source-linked wording regression checks
        run: node tests/adhkar-hadith-deep-batch.cjs
      - name: Four Quranic supplication and narrative-boundary checks
        run: node tests/adhkar-quran-deep-batch.cjs
      - name: Four Quranic verses exact Unicode comparison with Tanzil snapshot
        run: node tests/adhkar-quran-unicode-batch1.cjs
      - name: Remaining 11 Quranic duas Unicode and stop-sign profile comparison
        run: node tests/adhkar-quran-unicode-remaining-duas.cjs
      - name: Independent Tanzil exact Unicode comparison for 54 Quran verses
        run: node tests/adhkar-tanzil-exact-54.cjs
      - name: Quranic dua phonetic review anchors (not expert certification)
        run: node tests/adhkar-quran-transliteration-review-anchors.cjs
      - name: Five prophet supplications and narrative boundaries
        run: node tests/adhkar-prophets-deep-batch.cjs
      - name: Six additional prophet supplications and context boundaries
        run: node tests/adhkar-prophets-deep-batch-6.cjs
      - name: Seven short surahs and Dawud 5082 timing and recitation checks
        run: node tests/adhkar-short-surahs-batch-7.cjs
      - name: Final 13 hadith cards source and wording regression checks
        run: node tests/adhkar-hadith-final-13.cjs
      - name: Four hadith phonetics end-form and source guards
        run: node tests/adhkar-phonetics-batch2.cjs
      - name: Export transliteration review inventory
        run: node tests/transliteration-inventory.cjs > transliteration-inventory.json
      - name: Validate inventory report
        run: |
          node -e "const r=require('./transliteration-inventory.json');if(r.totalEntries!==43)throw Error('Expected 43 cards, found '+r.totalEntries); console.log('Inventory contains',r.totalEntries,'cards;',r.totalFlagged,'flagged for human review')"
      - name: Upload review inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transliteration-inventory
          path: transliteration-inventory.json
          if-no-files-found: warn
